# Starship config — https://starship.rs/config/

# ── Gcloud: disabled (shows service account noise in PS1) ─────────────────────
[gcloud]
disabled = true

# ── Username: only show when root or SSH ──────────────────────────────────────
[username]
show_always = false
format = "[$user]($style)@"

# ── Hostname: only show in SSH sessions ───────────────────────────────────────
[hostname]
ssh_only = true
format = "[$ssh_symbol$hostname]($style) "

# ── Directory ─────────────────────────────────────────────────────────────────
[directory]
truncation_length = 3
truncate_to_repo  = true
style             = "bold cyan"

# ── Git ───────────────────────────────────────────────────────────────────────
[git_branch]
format = "[$symbol$branch]($style) "
style  = "bold purple"

[git_status]
format    = "([$all_status$ahead_behind]($style) )"
style     = "bold red"
conflicted = "⚡"
ahead      = "⇡${count}"
behind     = "⇣${count}"
diverged   = "⇕⇡${ahead_count}⇣${behind_count}"
untracked  = "?"
modified   = "!"
staged     = "+"
deleted    = "✘"

# ── Languages (only show when in relevant project) ────────────────────────────
[nodejs]
format = "[$symbol($version)]($style) "

[python]
format = "[$symbol($version)]($style) "

[golang]
format = "[$symbol($version)]($style) "

[rust]
format = "[$symbol($version)]($style) "

[java]
format = "[$symbol($version)]($style) "

# ── Command duration ──────────────────────────────────────────────────────────
[cmd_duration]
min_time = 2000
format   = "[⏱ $duration]($style) "
style    = "yellow"

# ── Prompt character ──────────────────────────────────────────────────────────
[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"

# ── Disabled noise ────────────────────────────────────────────────────────────
[package]
disabled = true

[aws]
disabled = true

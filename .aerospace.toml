after-login-command  = []
after-startup-command = []

start-at-login = true

enable-normalization-flatten-containers                          = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 20

default-root-container-layout      = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-focus-changed           = 'move-mouse window-lazy-center'

automatically-unhide-macos-hidden-apps = false

[key-mapping]
preset = 'qwerty'

[gaps]
inner.horizontal = 5
inner.vertical   = 5
outer.bottom     = 5
outer.right      = 5
outer.left       = 5
outer.top        = 5

# ── Window rules ──────────────────────────────────────────────────────────────
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run       = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run       = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'Raycast'
run                         = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'Alfred'
run                         = 'layout floating'

# ── Main mode ─────────────────────────────────────────────────────────────────
[mode.main.binding]

# Close
cmd-q = 'close --quit-if-last-window'

# Focus
cmd-left  = 'focus left'
cmd-down  = 'focus down'
cmd-up    = 'focus up'
cmd-right = 'focus right'

# Move window
cmd-shift-left  = 'move left'
cmd-shift-down  = 'move down'
cmd-shift-up    = 'move up'
cmd-shift-right = 'move right'

# Layout (quick)
cmd-shift-space = 'layout floating tiling'
cmd-shift-f     = 'macos-native-fullscreen'

# Workspaces — switch
cmd-1 = 'workspace 1'
cmd-2 = 'workspace 2'
cmd-3 = 'workspace 3'
cmd-4 = 'workspace 4'
cmd-5 = 'workspace 5'
cmd-6 = 'workspace 6'
cmd-7 = 'workspace 7'
cmd-8 = 'workspace 8'
cmd-9 = 'workspace 9'
cmd-0 = 'workspace 0'

# Workspaces — move window
cmd-shift-1 = 'move-node-to-workspace 1'
cmd-shift-2 = 'move-node-to-workspace 2'
cmd-shift-3 = 'move-node-to-workspace 3'
cmd-shift-4 = 'move-node-to-workspace 4'
cmd-shift-5 = 'move-node-to-workspace 5'
cmd-shift-6 = 'move-node-to-workspace 6'
cmd-shift-7 = 'move-node-to-workspace 7'
cmd-shift-8 = 'move-node-to-workspace 8'
cmd-shift-9 = 'move-node-to-workspace 9'
cmd-shift-0 = 'move-node-to-workspace 0'

# Navigate
cmd-tab = 'workspace-back-and-forth'

# Service mode
cmd-shift-semicolon = 'mode service'

# ── Service mode ──────────────────────────────────────────────────────────────
# Enter with cmd-shift-;  |  Exit with esc or any action key
[mode.service.binding]
esc   = ['reload-config', 'mode main']
enter = 'mode main'

# Layout switching
e = ['layout tiles horizontal vertical',      'mode main']
s = ['layout accordion horizontal vertical',  'mode main']
f = ['layout floating tiling',                'mode main']

# Tree
r         = ['flatten-workspace-tree',           'mode main']
backspace  = ['close-all-windows-but-current',   'mode main']

# Join containers (vim keys)
h = ['join-with left',  'mode main']
j = ['join-with down',  'mode main']
k = ['join-with up',    'mode main']
l = ['join-with right', 'mode main']

# ── Workspace → monitor assignment ────────────────────────────────────────────
[workspace-to-monitor-force-assignment]
1 = 'main'
2 = 'main'
3 = 'main'
4 = 'main'
5 = 'secondary'
6 = 'secondary'
7 = 'secondary'
8 = 'secondary'
9 = 'secondary'
